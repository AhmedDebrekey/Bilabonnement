<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Damage — Bilabonnement</title>
    <link rel="stylesheet" th:href="@{/style.css}"/>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <h1>Add Damage Item</h1>

    <div class="card">
        <form th:action="@{/damages/save}" th:object="${damage}" method="post">

            <input type="hidden" th:field="*{reportId}"/>

            <div class="form-group">
                <label>Damage description</label>
                <input type="text" th:field="*{description}" placeholder="Scratched rear bumper"/>
                <span th:if="${#fields.hasErrors('description')}"
                      th:errors="*{description}" class="error"></span>
            </div>

            <div class="form-group">
                <label>Repair price (DKK)</label>
                <input type="number" step="0.01" th:field="*{price}" placeholder="1500"/>
                <span th:if="${#fields.hasErrors('price')}"
                      th:errors="*{price}" class="error"></span>
            </div>

            <div style="display:flex; gap:10px; margin-top:1rem;">
                <button type="submit" class="btn btn-primary">Save damage</button>
                <a href="/damage-reports" class="btn btn-secondary">Cancel</a>
            </div>

        </form>
    </div>
</div>

</body>
</html>
