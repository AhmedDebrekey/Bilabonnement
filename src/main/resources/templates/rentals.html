<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Rentals — Bilabonnement</title>
</head>
<body>

<h1>All Rental Agreements</h1>

<a href="/rentals/new">+ Add new rental</a>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Car ID</th>
        <th>Customer ID</th>
        <th>Start date</th>
        <th>End date</th>
        <th>Monthly price</th>
        <th>Pickup location</th>
        <th>Status</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="rentalAgreement : ${rentalAgreements}">
        <td th:text="${rentalAgreement.agreementId}"></td>
        <td th:text="${rentalAgreement.carId}"></td>
        <td th:text="${rentalAgreement.customerId}"></td>
        <td th:text="${rentalAgreement.startDate}"></td>
        <td th:text="${rentalAgreement.endDate}"></td>
        <td th:text="${rentalAgreement.monthlyPrice}"></td>
        <td th:text="${rentalAgreement.pickupLocation}"></td>
        <td th:text="${rentalAgreement.status}"></td>
    </tr>
    </tbody>
</table>

</body>
</html>
