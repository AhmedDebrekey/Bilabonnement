<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Rental — Bilabonnement</title>
    <link rel="stylesheet" th:href="@{/style.css}"/>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <h1>Register New Rental Agreement</h1>

    <div class="card">
        <form th:action="@{/rentals/save}" th:object="${rentalAgreement}" method="post">

            <div class="form-grid">
                <div class="form-group">
                    <label>Select car</label>
                    <select th:field="*{carId}">
                        <option value="">-- Select a car --</option>
                        <option th:each="car : ${cars}"
                                th:value="${car.carId}"
                                th:text="${car.brand} + ' ' + ${car.model} + ' — ' + ${car.licensePlate}">
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Select customer</label>
                    <select th:field="*{customerId}">
                        <option value="">-- Select a customer --</option>
                        <option th:each="customer : ${customers}"
                                th:value="${customer.customerId}"
                                th:text="${customer.name} + ' — ' + ${customer.email}">
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Start date</label>
                    <input type="date" th:field="*{startDate}"/>
                    <span th:if="${#fields.hasErrors('startDate')}"
                          th:errors="*{startDate}" class="error"></span>
                </div>

                <div class="form-group">
                    <label>End date</label>
                    <input type="date" th:field="*{endDate}"/>
                    <span th:if="${#fields.hasErrors('endDate')}"
                          th:errors="*{endDate}" class="error"></span>
                </div>

                <div class="form-group">
                    <label>Monthly price (DKK)</label>
                    <input type="number" th:field="*{monthlyPrice}" placeholder="6767"/>
                    <span th:if="${#fields.hasErrors('monthlyPrice')}"
                          th:errors="*{monthlyPrice}" class="error"></span>
                </div>

                <div class="form-group">
                    <label>Pickup location</label>
                    <input type="text" th:field="*{pickupLocation}" placeholder="Bilabonnement, København"/>
                    <span th:if="${#fields.hasErrors('pickupLocation')}"
                          th:errors="*{pickupLocation}" class="error"></span>
                </div>

            </div>

            <div style="display:flex; gap:10px; margin-top:1rem;">
                <button type="submit" class="btn btn-primary">Save rental agreement</button>
                <a href="/rentals" class="btn btn-secondary">Cancel</a>
            </div>

        </form>
    </div>
</div>

</body>
</html>
