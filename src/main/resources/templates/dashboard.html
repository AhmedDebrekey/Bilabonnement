<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard — Bilabonnement</title>
    <link rel="stylesheet" th:href="@{/style.css}"/>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <h1>Dashboard</h1>

    <div class="stats-grid">
        <div class="stat-card">
            <p>Cars currently rented out</p>
            <h2 th:text="${active}"></h2>
        </div>
        <div class="stat-card">
            <p>Total monthly revenue</p>
            <h2><span th:text="${totalRevenue}"></span> DKK</h2>
        </div>
        <div class="stat-card">
            <p>Total cars in system</p>
            <h2 th:text="${totalCars}"></h2>
        </div>
        <div class="stat-card">
            <p>Total customers</p>
            <h2 th:text="${totalCustomers}"></h2>
        </div>
    </div>
</div>

</body>
</html>
