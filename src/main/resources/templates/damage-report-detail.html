<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Damage Report Detail — Bilabonnement</title>
    <link rel="stylesheet" th:href="@{/style.css}"/>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <div class="page-header">
        <h1>Damage Report Details</h1>
        <a th:href="@{/damages/new/{reportId}(reportId=${report.reportId})}"
           class="btn btn-primary">+ Add damage item</a>
    </div>

    <div class="card" style="margin-bottom:1.5rem;">
        <div class="form-grid">
            <div>
                <p style="font-size:12px;color:#888;margin-bottom:4px;">Report ID</p>
                <p th:text="${report.reportId}"></p>
            </div>
            <div>
                <p style="font-size:12px;color:#888;margin-bottom:4px;">Car</p>
                <p th:text="${car.brand} + ' ' + ${car.model} + ' — ' + ${car.licensePlate}"></p>
            </div>
            <div>
                <p style="font-size:12px;color:#888;margin-bottom:4px;">Customer</p>
                <p th:text="${customer.name} + ' — ' + ${customer.email}"></p>
            </div>
            <div>
                <p style="font-size:12px;color:#888;margin-bottom:4px;">Report date</p>
                <p th:text="${report.reportDate}"></p>
            </div>
            <div>
                <p style="font-size:12px;color:#888;margin-bottom:4px;">Inspector</p>
                <p th:text="${report.inspectorName}"></p>
            </div>
        </div>
    </div>

    <h2>Damage items</h2>

    <table>
        <thead>
        <tr>
            <th>Description</th>
            <th>Repair cost (DKK)</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="damage : ${damages}">
            <td th:text="${damage.description}"></td>
            <td th:text="${damage.price}"></td>
        </tr>
        </tbody>
        <tfoot>
        <tr>
            <td><strong>Total repair cost</strong></td>
            <td><strong th:text="${total}"></strong> DKK</td>
        </tr>
        </tfoot>
    </table>

    <div style="margin-top:1.5rem;">
        <a href="/damage-reports" class="btn btn-secondary">Back to all reports</a>
    </div>
</div>

</body>
</html>
