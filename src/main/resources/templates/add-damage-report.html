<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Damage Report — Bilabonnement</title>
</head>
<body>

<h1>Register Damage Report</h1>

<form th:action="@{/damage-reports/save}" th:object="${damageReport}" method="post">

    <label>Select ended rental agreement</label>
    <select th:field="*{agreementId}">
        <option value="">-- Select a rental agreement --</option>
        <option th:each="agreement : ${endedAgreements}"
                th:value="${agreement.agreementId}"
                th:text="'Agreement #' + ${agreement.agreementId} + ' — Car ID: ' + ${agreement.carId}">
        </option>
    </select>

    <label>Report date</label>
    <input type="date" th:field="*{reportDate}"/>

    <label>Inspector name</label>
    <input type="text" th:field="*{inspectorName}" placeholder="John Smith"/>

    <button type="submit">Save damage report</button>
    <a href="/damage-reports">Cancel</a>

</form>

</body>
</html>
