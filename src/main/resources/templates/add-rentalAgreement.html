<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Rental — Bilabonnement</title>
</head>
<body>

<h1>Register New Rental Agreement</h1>

<form th:action="@{/rentals/save}" th:object="${rentalAgreement}" method="post">

    <label>Select car</label>
    <select th:field="*{carId}">
        <option value="">-- Select a car --</option>
        <option th:each="car : ${cars}"
                th:value="${car.carId}"
                th:text="${car.brand} + ' ' + ${car.model} + ' — ' + ${car.licensePlate}">
        </option>
    </select>
    <br/>

    <label>Select customer</label>
    <select th:field="*{customerId}">
        <option value="">-- Select a customer --</option>
        <option th:each="customer : ${customers}"
                th:value="${customer.customerId}"
                th:text="${customer.name} + ' — ' + ${customer.email}">
        </option>
    </select>
    <br/>

    <label>Start date</label>
    <input type="date" th:field="*{startDate}"/>
    <span th:if="${#fields.hasErrors('startDate')}"
          th:errors="*{startDate}"
          style="color:red;">
    </span>
    <br/>

    <label>End date</label>
    <input type="date" th:field="*{endDate}"/>
    <span th:if="${#fields.hasErrors('endDate')}"
          th:errors="*{endDate}"
          style="color:red;">
    </span>
    <br/>

    <label>Monthly price (DKK)</label>
    <input type="number" th:field="*{monthlyPrice}" placeholder="3199"/>
    <span th:if="${#fields.hasErrors('monthlyPrice')}"
          th:errors="*{monthlyPrice}"
          style="color:red;">
    </span>
    <br/>

    <label>Pickup location</label>
    <input type="text" th:field="*{pickupLocation}" placeholder="Bilabonnement A/S, København"/>
    <span th:if="${#fields.hasErrors('pickupLocation')}"
          th:errors="*{pickupLocation}"
          style="color:red;">
    </span>
    <br/>

    <label>Status</label>
    <select th:field="*{status}">
        <option value="Active">Active</option>
        <option value="Ended">Ended</option>
        <option value="Pending">Pending</option>
    </select>
    <br/>

    <button type="submit">Save rental agreement</button>
    <a href="/rentals">Cancel</a>

</form>

</body>
</html>
