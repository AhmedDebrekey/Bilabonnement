spring.application.name=bilabonnement

# Azure MySQL Database
spring.datasource.url=jdbc:mysql://bilabonnement-db.mysql.database.azure.com:3306/bilabonnement?useSSL=true&serverTimezone=UTC
spring.datasource.username=bilabonnement_admin
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JdbcTemplate
spring.jdbc.template.query-timeout=30