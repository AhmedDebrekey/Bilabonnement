<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Damage Report — Bilabonnement</title>
    <link rel="stylesheet" th:href="@{/style.css}"/>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <h1>Register Damage Report</h1>

    <div class="card">
        <form th:action="@{/damage-reports/save}" th:object="${damageReport}" method="post">

            <input type="hidden" th:field="*{agreementId}"/>

            <div class="form-grid">
                <div class="form-group">
                    <label>Report date</label>
                    <input type="date" th:field="*{reportDate}"/>
                    <span th:if="${#fields.hasErrors('reportDate')}"
                          th:errors="*{reportDate}" class="error"></span>
                </div>

                <div class="form-group">
                    <label>Inspector name</label>
                    <input type="text" th:field="*{inspectorName}" placeholder="John Smith"/>
                    <span th:if="${#fields.hasErrors('inspectorName')}"
                          th:errors="*{inspectorName}" class="error"></span>
                </div>
            </div>

            <div style="display:flex; gap:10px; margin-top:1rem;">
                <button type="submit" class="btn btn-primary">Save damage report</button>
                <a href="/damage-reports" class="btn btn-secondary">Cancel</a>
            </div>

        </form>
    </div>
</div>

</body>
</html>
