<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Damage Reports — Bilabonnement</title>
    <link rel="stylesheet" th:href="@{/style.css}"/>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <div class="page-header">
        <h1>Damage Reports</h1>
    </div>

    <table>
        <thead>
        <tr>
            <th>Car</th>
            <th>Customer</th>
            <th>Rental period</th>
            <th>Report status</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="agreement : ${endedAgreements}">
            <td th:text="${carMap[agreement.carId].brand} + ' ' + ${carMap[agreement.carId].model} + ' — ' + ${carMap[agreement.carId].licensePlate}"></td>
            <td th:text="${customerMap[agreement.customerId].name}"></td>
            <td th:text="${agreement.startDate} + ' → ' + ${agreement.endDate}"></td>
            <td>
                    <span th:if="${reportMap[agreement.agreementId] != null}"
                          class="badge badge-active">Report done</span>
                <span th:if="${reportMap[agreement.agreementId] == null}"
                      class="badge badge-awaiting">No report yet</span>
            </td>
            <td>
                <div class="actions-cell">
                    <a th:if="${reportMap[agreement.agreementId] != null}"
                       th:href="@{/damage-reports/{reportId}(reportId=${reportMap[agreement.agreementId].reportId})}"
                       class="btn btn-sm btn-secondary">View report</a>
                    <a th:if="${reportMap[agreement.agreementId] == null}"
                       th:href="@{/damage-reports/new/{agreementId}(agreementId=${agreement.agreementId})}"
                       class="btn btn-sm btn-primary">Create report</a>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
